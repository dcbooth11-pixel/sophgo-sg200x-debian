

      - name: Build Oz64 Debian image
        run: |
          mkdir -p image

          # Confirm the required addon exists
          test -f scripts/addons/preconfigure/addon.mk

          docker run --privileged --rm \
            -v "$PWD/configs:/configs" \
            -v "$PWD/scripts:/builder" \
            -v "$PWD/image:/output" \
            ghcr.io/scpcom/sophgo-sg200x-debian:debian \
            make BOARD=oz64 \
            SECOND_CPU=arduino \
            IMAGE_HOSTNAME=oz64-dylan \
            image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .

      - name: Enable RISC-V emulation
        run: |
          docker run --privileged --rm \
            tonistiigi/binfmt:qemu-v9.2.2 \
            --install riscv64

          docker run --rm \
            --platform linux/riscv64 \
            debian:trixie uname -m

      - name: Build Oz64 Debian image
        run: |
          mkdir -p image

          docker run --privileged --rm \
            -v "$PWD/configs:/configs" \
            -v "$PWD/image:/output" \
            ghcr.io/scpcom/sophgo-sg200x-debian:debian \
            make BOARD=oz64 \
            SECOND_CPU=arduino \
            IMAGE_HOSTNAME=oz64-dylan \
            image


      - name: Verify output
        run: |
          ls -lh image/
          test -s image/oz64-e_sd.img.lz4

      - name: Upload completed image
        uses: actions/upload-artifact@v4
        with:
          name: oz64-dylan
          path: image/oz64-e_sd.img.lz4
          if-no-files-found: error
          retention-days: 3

